<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riihisoft CSS | View transitions example</title>
  <script src="/js/main.js" type="module" blocking="render"></script>
  <link href="/css/style.css" rel="stylesheet">
  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <style>
    :root {
      view-transition-name: none;
    }

    fieldset {
      border-color: var(--color-border);
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-md);
      width: 100%;
      height: 100%;
    }

    fieldset > div {
      flex: 1 1 300px;
      background-color: var(--color-fg);
      border: 1px solid var(--color-border);
    }

    ::view-transition-group(block-1),
    ::view-transition-group(block-2),
    ::view-transition-group(block-3),
    ::view-transition-group(block-4),
    ::view-transition-group(block-5) {
      animation: none;
    }

    ::view-transition-old(block-1),
    ::view-transition-old(block-2),
    ::view-transition-old(block-3),
    ::view-transition-old(block-4),
    ::view-transition-old(block-5) {
      animation: box-out 180ms ease both;
    }

    ::view-transition-new(block-1),
    ::view-transition-new(block-2),
    ::view-transition-new(block-3),
    ::view-transition-new(block-4),
    ::view-transition-new(block-5) {
      animation: box-in 220ms ease both;
    }

    @keyframes box-in {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes box-out {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-25px);
      }
    }
  </style>
</head>

<body>
  <rs-nav></rs-nav>

  <main class="container">
      <rs-editor 
        css=""
        open="false"
      >

        <fieldset>
          <legend>Yhden sivun view transition esimerkki</legend>
          <div style="view-transition-name: block-1;"></div>
          <div style="view-transition-name: block-2;"></div>
        </fieldset>

        <div>
          <button type="button" class="button primary">Lisää laatikko</button>
          <button type="button" class="button secondary">Poista laatikko</button>
        </div>

      </rs-editor>
  </main>

  <rs-footer></rs-footer>

  <script defer>
    const addButton = document.querySelector("div>button:first-child");
    const deleteButton = document.querySelector("div>button:last-child");
    const fieldset = document.querySelector("fieldset");

    addButton.addEventListener("click", () => {
      const newBox = document.createElement("div");
      const boxesAmount = fieldset.childElementCount;
      newBox.style.viewTransitionName = `block-${boxesAmount}`;

      if (document.startViewTransition) {
        document.startViewTransition(() => {
          fieldset.appendChild(newBox);
        });
      }
    });

    deleteButton.addEventListener("click", () => {
      const lastBox = document.querySelector("fieldset>div:last-of-type:not(:first-of-type)");
      if (!lastBox) return;
      document.startViewTransition(() => {
        lastBox.remove();
      });
    });
  </script>
</body>

</html>
