<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riihisoft CSS | @property and functions example</title>
  <script src="/js/main.js" type="module" blocking="render"></script>
  <link href="/css/style.css" rel="stylesheet">
  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <style>
    fieldset {
      border-color: var(--color-border);
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-md);
    }

    .loading-skeleton {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .gradients {
      display: grid;
      place-content: center;
    }

    .gradients div {
      width: 5rem;
      aspect-ratio: 1;
      border-radius: 50%;
    }

    .loading-skeleton div {
      --highlight-color: oklch(from var(--color-fg) calc(l * 1.25) c h);
      --shine-width: 10%;

      height: 6rem;

      &:first-of-type {
        grid-column: 1/-1;
      }
    }
  </style>
</head>

<body>
  <rs-nav></rs-nav>

  <main class="container">
    <rs-editor
      css='@property --shine-pos {\n\tsyntax: "<percentage>";\n\tinherits: false;\n\tinitial-value: 0%;\n}\n\n.loading-skeleton div {\n\tbackground: linear-gradient(120deg,\n\t\tvar(--color-fg) calc(var(--shine-pos) - var(--shine-width)),\n\t\tvar(--highlight-color) var(--shine-pos),\n\t\tvar(--color-fg) calc(var(--shine-pos) + var(--shine-width)));\n}\n\n@media (prefers-reduced-motion: no-preference) {\n\t.loading-skeleton div {\n\t\tanimation: skeleton-shine 2s linear infinite;\n\t}\n}\n\n@keyframes skeleton-shine {\n\tfrom {\n\t\t--shine-pos: -20%;\n\t}\n\n\tto {\n\t\t--shine-pos: 150%;\n\t}\n}\n\n@property --angle {\n\tsyntax: "<angle>";\n\tinherits: false;\n\tinitial-value: 0deg;\n}\n\n.gradients div {\n\tbackground: conic-gradient(from var(--angle),\n\t\toklch(from var(--color-brand) l c h) 0deg 90deg,\n\t\toklch(from var(--color-brand) l c calc(h + 60)) 90deg 180deg,\n\t\toklch(from var(--color-brand) l c calc(h + 120)) 180deg 270deg,\n\t\toklch(from var(--color-brand) l c calc(h + 180)) 270deg 360deg);\n\n\t-webkit-mask: radial-gradient(circle, transparent 30%, black 31%);\n\tmask: radial-gradient(circle, transparent 30%, black 31%);\n}\n\n@media (prefers-reduced-motion: no-preference) {\n\t.gradients div {\n\t\tanimation: spin 1s linear infinite;\n\t}\n}\n\n@keyframes spin {\n\tto {\n\t\t--angle: 360deg;\n\t}\n}'
      open="false">

      <fieldset class="loading-skeleton">
        <legend>Loading skeleton -esimerkki</legend>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </fieldset>

      <fieldset class="gradients">
        <legend>Gradientti animaatio</legend>
        <div></div>
      </fieldset>

    </rs-editor>
  </main>

  <rs-footer></rs-footer>
</body>

</html>
